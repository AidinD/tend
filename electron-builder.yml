appId: io.github.aidind.tend
productName: Tend
directories:
  buildResources: resources

# Tend has no build step, so the packaged app ships src/ directly rather than a
# compiled out/. See DECISIONS.md - the storage, domain and service layers stay
# buildless because the MCP server imports them with no compile in between.
files:
  - src/**
  - resources/**
  - package.json
  - "!src/**/*.test.mjs"

  # keel is a SYMLINK to a sibling checkout, so whatever is sitting in that
  # working tree at build time gets packed - including things that have nothing
  # to do with the dependency. On 2026-09-17 that was another session's live git
  # worktree under `.claude/worktrees/`, half a megabyte of it, and the asar came
  # out CORRUPT: reading `package.json` back out of the archive returned the tail
  # of a zod source file, and the packaged app died before Electron started with
  # no output at all. Files whose size changes while the archive is being written
  # leave every offset after them pointing at the wrong bytes.
  #
  # Two reasons to keep this, not one. The corruption is the loud failure; the
  # quiet one is that an agent worktree can hold anything, and this installer is
  # published. Nothing under a sibling's tooling directory belongs in it.
  - "!node_modules/*/.claude/**"
  - "!node_modules/*/.git/**"

win:
  target:
    - nsis
  # The generated multi-size .ico, not the PNG: electron-builder would
  # downscale one 512px bitmap to 16px, which is what the simplified small
  # drawing in scripts/generate-icon.mjs exists to avoid.
  icon: resources/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: AidinD
  repo: tend
  releaseType: release

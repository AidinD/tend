<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>Tend</title>
    <!-- keel first, so anything below can override it. It provides only the
         frameless shell: body as a fixed flex column, the header pinned, the
         window buttons. Everything about how Tend looks stays in app.css. -->
    <link rel="stylesheet" href="../../node_modules/keel/src/shell/shell.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- The window is frameless, so this row is both the wordmark and the drag
         handle, and carries the window buttons. Same arrangement as Jot and Nib. -->
    <header class="app-header">
      <div class="brand">
        <!-- The same artwork the icon is built from, so the mark beside the
             wordmark and the mark in the taskbar are one picture rather than two
             drawings that can drift. Helm does it this way for the same reason.
             The file is large on purpose - it is the source the .ico frames are
             resampled from - and the browser scales it down for this row. -->
        <!-- The src is replaced in the private half. See applyHalf in app.js. -->
        <img class="brand-mark" id="brand-mark" src="assets/tend-logo.png" alt="" width="22" height="22" />
        <span class="wordmark">Tend</span>
        <!--
          Only ever filled in private mode, and empty markup the rest of the
          time. A badge that is always there stops being read, which is the
          failure mode the rail counts are already arranged around - and this one
          is the label that has to still be doing its job in six months.
        -->
        <span class="mode-badge" id="mode-badge"></span>
        <span class="version" id="version"></span>
      </div>
      <div class="header-right">
        <!-- A shortcut nobody knows about is a shortcut nobody uses, and this
             one is where the app is meant to be quickest. Stated rather than
             left to be discovered, and not a button: it is a label. -->
        <span class="palette-cue" aria-hidden="true"><kbd>Ctrl</kbd><kbd>K</kbd></span>
        <div class="window-controls">
          <button type="button" data-window="minimize" title="Minimise">–</button>
          <button type="button" data-window="maximize" title="Maximise">□</button>
          <button type="button" data-window="close" class="danger" title="Close">×</button>
        </div>
      </div>
    </header>

    <div class="app">
      <nav class="rail">
        <div class="nav">
          <button class="nav-btn" data-view="now" aria-current="true">
            Now <span class="nav-count" id="count-now"></span>
          </button>
          <button class="nav-btn" data-view="prep">
            Prep <span class="nav-count" id="count-prep"></span>
          </button>
          <button class="nav-btn" data-view="focus">
            Focus <span class="nav-count" id="count-focus"></span>
          </button>
          <button class="nav-btn" data-view="people">
            People <span class="nav-count" id="count-people"></span>
          </button>
          <button class="nav-btn" data-view="work">Work</button>
          <!-- No count, deliberately. Every other entry here earns a number
               because something is waiting; nothing in the journal waits, and a
               badge on an optional habit is only ever a reproach. -->
          <button class="nav-btn" data-view="journal">The day</button>
          <button class="nav-btn" data-view="role">
            Role map <span class="nav-count" id="count-role"></span>
          </button>
          <button class="nav-btn" data-view="decisions">
            Decisions <span class="nav-count" id="count-decisions"></span>
          </button>
          <!-- Last in the rail, and no count: it is the only view you go to
               with a question rather than to see what changed. -->
          <button class="nav-btn" data-view="knowledge">Knowledge</button>
        </div>

        <div class="nav nav-foot">
          <button class="nav-btn" data-view="settings">Settings</button>
        </div>
      </nav>

      <main id="main">
        <div class="loading">Reading the log…</div>
      </main>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
